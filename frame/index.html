<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111315"><meta name="description" content="Frame — a vector-native presentation operating system"><title>Opening Frame…</title><style>html,body{margin:0;height:100%;background:#111315;color:#eef0f4;font-family:Inter,ui-sans-serif,system-ui,sans-serif}main{height:100%;display:grid;place-items:center}.open{display:flex;align-items:center;gap:18px}.mark{width:52px;height:52px;border-radius:15px;background:#5e7cff;display:grid;place-items:center;font-weight:850;font-size:25px;box-shadow:0 16px 44px rgba(94,124,255,.25)}strong{display:block;font-size:17px}span{display:block;margin-top:5px;color:#9aa1ad;font-size:13px}.bar{height:3px;width:190px;background:#25282d;border-radius:9px;margin-top:14px;overflow:hidden}.bar i{display:block;height:100%;width:38%;background:#5e7cff;border-radius:inherit;animation:load 1.1s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(165%)}}.error{max-width:560px;padding:28px;line-height:1.5}button{margin-top:16px;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}</style></head><body><main id="stage"><div class="open"><div class="mark">F</div><div><strong>Opening Frame</strong><span>Loading the presentation operating system…</span><div class="bar"><i></i></div></div></div></main><script>
(async()=>{try{const names=["chunks/part-00.txt", "chunks/part-01.txt", "chunks/part-02.txt", "chunks/part-03.txt", "chunks/part-04.txt", "chunks/part-05.txt", "chunks/part-06.txt"];const parts=await Promise.all(names.map(n=>fetch(n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Missing '+n);return r.text()})));const bin=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('Use a current version of Chrome, Edge, or Safari to open this hosted build.');const stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));const htmlText=await new Response(stream).text();document.open();document.write(htmlText);document.close();}catch(e){document.getElementById('stage').innerHTML='<div class="error"><h1>Frame could not open.</h1><p>'+e.message+'</p><button onclick="location.reload()">Try again</button></div>';console.error(e)}})();
</script></body></html>
