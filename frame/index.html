<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111315">
<meta name="description" content="Frame is a vector-native presentation operating system for story, design, sequence, and critique.">
<title>Frame — Presentation Operating System</title>
<style>
html,body{height:100%;margin:0;background:#111315;color:#f4f3ef;font-family:Inter,Arial,sans-serif}
.boot{height:100%;display:grid;place-items:center}.boot-card{display:flex;align-items:center;gap:18px;padding:24px 28px;border:1px solid rgba(255,255,255,.12);border-radius:20px;background:#171a1d;box-shadow:0 24px 80px rgba(0,0,0,.35)}
.mark{width:48px;height:48px;border-radius:15px;background:#f4f3ef;color:#111315;display:grid;place-items:center;font-weight:800;font-size:24px}
strong{display:block;font-size:17px}span{display:block;color:#a8adb3;margin-top:4px;font-size:13px}.err{max-width:620px;line-height:1.5;padding:24px}
</style>
</head>
<body>
<div class="boot"><div class="boot-card"><div class="mark">F</div><div><strong>Opening Frame</strong><span>Loading the presentation operating system…</span></div></div></div>
<script>
(async()=>{
  try{
    const files=['payload-00.txt','payload-01.txt','payload-02.txt','payload-03.txt','payload-04.txt','payload-05.txt','payload-06.txt','payload-07.txt','payload-08.txt','payload-09.txt','payload-10.txt','payload-11.txt'];
    const parts=await Promise.all(files.map(async file=>{const response=await fetch(file,{cache:'no-store'});if(!response.ok)throw new Error('A Frame application file could not be loaded.');return response.text();}));
    const binary=atob(parts.join(''));const bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    if(!('DecompressionStream' in window))throw new Error('This browser needs a current version of Chrome, Edge, Safari, or Firefox.');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const text=await new Response(stream).text();
    document.open();document.write(text);document.close();
  }catch(err){document.body.innerHTML='<div class="boot"><div class="err"><h1>Frame could not open.</h1><p>'+String(err.message||err)+'</p><p>Refresh once. If the issue remains, use a current Chrome or Edge browser.</p></div></div>';}
})();
</script>
</body>
</html>
