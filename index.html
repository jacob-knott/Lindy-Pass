  <script>
    let currentFilter = 'Overview';
    let wireData = [];
    let isSyncing = false;
    let mlbStandingsCache = null;
    let sortableInstance = null;
    
    const DEFAULT_TOPICS = ['Kansas City Royals', 'PGA Tour', 'Auburn Football', 'Auburn Basketball', 'Auburn Baseball'];
    let userTopics = JSON.parse(localStorage.getItem('signalPassTopics')) || DEFAULT_TOPICS;

    // --- BRANDING & UTILITIES ---
    function getTopicBrand(topicName) {
      const lower = topicName.toLowerCase();
      if (lower.includes('royals') || lower.includes('kansas city')) return { from: '#002b5c', to: '#000000', accent: '#bd9b60' };
      if (lower.includes('auburn')) return { from: '#031428', to: '#000000', accent: '#e87722' };
      if (lower.includes('pga') || lower.includes('golf')) return { from: '#06261b', to: '#000000', accent: '#F9E547' };
      if (lower.includes('mlb') || lower.includes('baseball')) return { from: '#001833', to: '#000000', accent: '#e11d48' };

      const palettes = [
        { from: '#18181b', to: '#000000', accent: '#60a5fa' }, 
        { from: '#1f2937', to: '#000000', accent: '#9ca3af' },
        { from: '#171717', to: '#000000', accent: '#f87171' }
      ];
      const charCode = topicName.charCodeAt(0) + topicName.charCodeAt(topicName.length - 1);
      return palettes[charCode % palettes.length];
    }

    function getTimeAgo(dateString) {
      const past = new Date(dateString.replace(/-/g, '/').replace('T', ' ')); 
      const diffMins = Math.floor((new Date() - past) / 60000);
      const diffHrs = Math.floor(diffMins / 60);
      if (isNaN(diffMins) || diffMins < 0) return 'JUST NOW'; 
      if (diffMins < 10) return 'JUST NOW';
      if (diffMins < 60) return `${diffMins}M AGO`;
      if (diffHrs < 24) return `${diffHrs}H AGO`;
      return `${Math.floor(diffHrs/24)}D AGO`;
    }

    function analyzeImpact(title) {
      const lower = title.toLowerCase();
      if (lower.match(/(injury|torn|surgery|trade|fired|commits|portal|transfer|suspended|il|arrest)/)) return { level: 'CRITICAL', color: 'text-red-600 dark:text-red-500' };
      if (lower.match(/(win|champion|lead|draft|signs|extension|rumor|sweep|record|homer|blast)/)) return { level: 'HIGH', color: 'text-orange-600 dark:text-orange-500' };
      return { level: 'UPDATE', color: 'text-stone-500 dark:text-stone-400' };
    }

    // --- MASTER TELEMETRY ENGINE ---
    
    // 1. The Out-Of-Season Fallback Fetcher
    async function fetchFallbackTeamAPI(topicName) {
      const topicLower = topicName.toLowerCase();
      let sportPath = '';
      if (topicLower.includes('football')) sportPath = 'football/college-football';
      else if (topicLower.includes('basketball')) sportPath = 'basketball/mens-college-basketball';
      else if (topicLower.includes('baseball') && topicLower.includes('auburn')) sportPath = 'baseball/college-baseball';
      else if (topicLower.includes('royals') || topicLower.includes('mlb')) sportPath = 'baseball/mlb';
      else sportPath = 'football/college-football'; // Generic fallback

      const cleanTopic = topicLower.replace(/\b(football|basketball|baseball|mens|womens|tour|athletics|mlb|nba|nfl)\b/g, '').trim();
      const slug = cleanTopic.replace(/\s+/g, '-');

      try {
        const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${sportPath}/teams/${slug}`);
        const data = await res.json();
        if (!data.team) return null;

        const t = data.team;
        const record = t.record?.items?.[0]?.summary || '';
        const rank = t.rank || null;
        const logo = t.logos?.[0]?.href || null;
        const standing = t.standingSummary || '';

        let gameObj = null;
        if (t.nextEvent && t.nextEvent.length > 0) {
          const evt = t.nextEvent[0];
          const comp = evt.competitions[0];
          const opp = comp.competitors.find(c => c.id !== t.id) || comp.competitors[0];
          const isHome = comp.competitors.find(c => c.id === t.id)?.homeAway === 'home';

          const date = new Date(evt.date);
          const detail = `NEXT • ${date.toLocaleDateString('en-US', {month:'short', day:'numeric'})}`;

          gameObj = {
            isLive: false, isPre: true, isPost: false, detail: detail,
            ourScore: '', oppScore: '',
            oppAbbrev: opp.team?.abbreviation || opp.team?.displayName || 'TBD',
            isHome: isHome, standing: standing
          };
        } else {
          gameObj = {
            isLive: false, isPre: true, isPost: false, detail: 'OFFSEASON',
            ourScore: '', oppScore: '', oppAbbrev: 'TBD',
            isHome: true, standing: standing
          };
        }

        return {
          type: 'team', teamName: t.displayName, logo: logo, record: record, rank: rank,
          game: gameObj, link: t.links?.[0]?.href || '#'
        };
      } catch(e) { return null; }
    }

    // 2. The 7-Day Scoreboard Router
    async function checkScoreboard(topicName) {
      const topicLower = topicName.toLowerCase();
      
      const d = new Date();
      const past = new Date(d); past.setDate(d.getDate() - 3); 
      const future = new Date(d); future.setDate(d.getDate() + 5); 
      const pad = n => n.toString().padStart(2, '0');
      const dateParams = `?dates=${past.getFullYear()}${pad(past.getMonth()+1)}${pad(past.getDate())}-${future.getFullYear()}${pad(future.getMonth()+1)}${pad(future.getDate())}&limit=200`;

      let endpoints = [];
      if (topicLower.includes('football')) endpoints = [`https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard${dateParams}`, `https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard${dateParams}`];
      else if (topicLower.includes('basketball')) endpoints = [`https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/scoreboard${dateParams}`, `https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard${dateParams}`];
      else if (topicLower.includes('baseball') || topicLower.includes('mlb')) endpoints = [`https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard${dateParams}`, `https://site.api.espn.com/apis/site/v2/sports/baseball/college-baseball/scoreboard${dateParams}`];
      else endpoints = [`https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard${dateParams}`, `https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard${dateParams}`, `https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/scoreboard${dateParams}`, `https://site.api.espn.com/apis/site/v2/sports/baseball/college-baseball/scoreboard${dateParams}`];
      
      const cleanTopic = topicLower.replace(/\b(football|basketball|baseball|mens|womens|tour|athletics|mlb|nba|nfl)\b/g, '').trim();
      const searchTerms = cleanTopic.split(' ').filter(w => w.length > 1);

      const fetchPromises = endpoints.map(async (url) => {
        try {
          const res = await fetch(url);
          const data = await res.json();
          if (!data.events) return [];
          return data.events.filter(event => {
            if (!event.competitions || !event.competitions[0]) return false;
            return event.competitions[0].competitors.some(c => {
               const fullName = c.team.displayName.toLowerCase(); 
               const abbrev = c.team.abbreviation.toLowerCase(); 
               return searchTerms.length > 0 && searchTerms.every(term => fullName.includes(term) || abbrev === term);
            });
          });
        } catch(e) { return []; }
      });

      const resultsArrays = await Promise.all(fetchPromises);
      const matchedEvents = resultsArrays.flat();

      if (matchedEvents.length === 0) return null;

      let targetEvent = matchedEvents.find(e => e.status.type.state === 'in');
      if (!targetEvent) targetEvent = matchedEvents.filter(e => e.status.type.state === 'pre').sort((a,b) => new Date(a.date) - new Date(b.date))[0];
      if (!targetEvent) targetEvent = matchedEvents.filter(e => e.status.type.state === 'post').sort((a,b) => new Date(b.date) - new Date(a.date))[0];

      if (targetEvent) {
        const comp = targetEvent.competitions[0];
        const ourTeamObj = comp.competitors.find(c => {
           const fn = c.team.displayName.toLowerCase();
           return searchTerms.every(term => fn.includes(term));
        }) || comp.competitors[0]; 
        
        const opponentObj = comp.competitors.find(c => c.team.id !== ourTeamObj.team.id) || comp.competitors[1];
        const status = targetEvent.status.type.state;
        
        const record = ourTeamObj.records && ourTeamObj.records.length > 0 ? ourTeamObj.records[0].summary : null;
        const rank = ourTeamObj.curatedRank && ourTeamObj.curatedRank.current && ourTeamObj.curatedRank.current !== 99 ? ourTeamObj.curatedRank.current : null;
        const logo = ourTeamObj.team.logo || null;
        
        let detail = targetEvent.status.type.detail;
        if (status === 'pre') {
          const dt = new Date(targetEvent.date);
          const today = new Date();
          const isToday = dt.getDate() === today.getDate() && dt.getMonth() === today.getMonth();
          const dayStr = isToday ? 'TODAY' : dt.toLocaleDateString('en-US', { weekday: 'short' }).toUpperCase();
          detail = `${dayStr} • ${dt.toLocaleTimeString([], {hour: 'numeric', minute:'2-digit'})}`;
        }
        else if (status === 'post') detail = 'FINAL';

        return {
          type: 'team', teamName: ourTeamObj.team.displayName, logo: logo, record: record, rank: rank,
          game: {
            isLive: status === 'in', isPre: status === 'pre', isPost: status === 'post', detail: detail,
            ourScore: ourTeamObj.score, oppScore: opponentObj.score, oppAbbrev: opponentObj.team.abbreviation,
            isHome: ourTeamObj.homeAway === 'home', standing: ''
          },
          link: targetEvent.links.find(l => l.rel.includes('desktop'))?.href || `https://www.espn.com/search/_/q/${encodeURIComponent(topicName)}`
        };
      }
      return null;
    }

    async function fetchTeamVitals(topicName) {
      const topicLower = topicName.toLowerCase();
      
      // Golf Specific Architecture
      if (topicLower.includes('pga') || topicLower.includes('golf')) {
        try {
          const res = await fetch('https://site.api.espn.com/apis/site/v2/sports/golf/leaderboard');
          const data = await res.json();
          const event = data.events[0];
          if(!event) return null;
          
          const comp = event.competitions[0];
          const leaders = comp.competitors.slice(0, 3).map((c, i) => {
             const scoreVal = typeof c.score === 'object' ? (c.score.displayValue || c.score.value || 'E') : c.score;
             return `${i+1}. ${c.athlete.shortName} (${scoreVal})`;
          }).join(' • ');
          
          let detail = event.status.type.detail;
          if (event.status.type.state === 'post') detail = 'FINAL RESULTS';
          
          return { type: 'golf', name: event.shortName || event.name, detail: detail, leaders: leaders };
        } catch(e) { return null; }
      }

      // Deep Team Telemetry (Scoreboard -> Fallback API)
      let vitals = await checkScoreboard(topicName);
      if (!vitals) {
        vitals = await fetchFallbackTeamAPI(topicName);
      }
      return vitals;
    }

    async function loadMLBStandings() {
      if (mlbStandingsCache) return mlbStandingsCache;
      try {
        const res = await fetch('https://statsapi.mlb.com/api/v1/standings?leagueId=103,104');
        const data = await res.json();
        const teams = {};
        data.records.forEach(division => {
          division.teamRecords.forEach(teamData => {
            teams[teamData.team.name.toLowerCase()] = {
              wins: teamData.wins, losses: teamData.losses, rank: teamData.divisionRank, 
              streak: teamData.streak ? teamData.streak.streakCode : '-', gb: teamData.gamesBack || '0'
            };
          });
        });
        mlbStandingsCache = teams;
        return teams;
      } catch (err) { return null; }
    }

    // --- UNIVERSAL DATA CARD RENDERER ---
    async function renderVitals() {
      const container = document.getElementById('vitals-container');
      
      if (currentFilter === 'Overview') {
        container.innerHTML = ``; 
        return;
      }

      container.innerHTML = `
        <div class="mb-4 bg-white dark:bg-[#161618] rounded-[24px] border border-stone-200 dark:border-stone-800 p-5 shadow-sm animate-pulse flex flex-col gap-4">
           <div class="flex justify-between items-center"><div class="h-8 w-12 bg-stone-200 dark:bg-stone-800 rounded-full"></div><div class="h-8 w-24 bg-stone-200 dark:bg-stone-800 rounded"></div></div>
           <div class="h-px w-full bg-stone-100 dark:bg-stone-800"></div>
           <div class="h-4 w-48 bg-stone-200 dark:bg-stone-800 rounded"></div>
        </div>
      `;

      try {
        const [vitals, mlbTeams] = await Promise.all([ fetchTeamVitals(currentFilter), loadMLBStandings() ]);

        if (!vitals) {
          container.innerHTML = ``; 
          return;
        }

        if (vitals.type === 'golf') {
          container.innerHTML = `
            <div class="mb-6 bg-white dark:bg-[#161618] rounded-[24px] border border-stone-200 dark:border-stone-800 p-5 shadow-sm overflow-hidden relative">
              <div class="absolute -right-6 -top-6 w-32 h-32 bg-emerald-500/10 rounded-full blur-2xl"></div>
              <div class="flex justify-between items-start mb-4 relative z-10">
                <div class="flex flex-col">
                  <span class="text-[10px] font-mono font-bold tracking-widest text-emerald-600 dark:text-emerald-500 uppercase mb-1">PGA Tour Leaderboard</span>
                  <span class="font-black text-stone-900 dark:text-white uppercase tracking-tight text-xl leading-none">${vitals.name}</span>
                </div>
                <span class="text-[10px] px-2 py-0.5 bg-stone-100 dark:bg-stone-800 text-stone-600 dark:text-stone-300 rounded font-mono uppercase shrink-0">${vitals.detail}</span>
              </div>
              <div class="h-px w-full bg-stone-100 dark:bg-stone-800 mb-4 relative z-10"></div>
              <div class="text-[12px] font-mono font-bold tracking-widest uppercase text-stone-700 dark:text-stone-300 relative z-10">
                ${vitals.leaders}
              </div>
            </div>
          `;
          return;
        }

        if (vitals.type === 'team') {
          const game = vitals.game;
          const logoHtml = vitals.logo ? `<img src="${vitals.logo}" class="w-12 h-12 object-contain drop-shadow-sm" />` : '';
          const recordHtml = vitals.record ? `<span class="font-black text-signal-accent text-3xl tracking-tighter leading-none">${vitals.record}</span>` : '';
          const rankHtml = vitals.rank ? `<span class="text-[10px] font-mono text-stone-500 uppercase tracking-widest block mt-1">#${vitals.rank} AP</span>` : '';
          
          let gameString = '';
          let indicator = '';
          
          if (game.detail === 'OFFSEASON') {
             indicator = `<span class="text-stone-500">STATUS</span>`;
             gameString = `<span class="opacity-50">AWAITING SCHEDULE</span>`;
          } else if (game.isLive) {
            indicator = `<span class="text-red-500 flex items-center gap-1.5"><span class="flex h-1.5 w-1.5 relative"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-red-500"></span></span>LIVE</span>`;
            gameString = `<span class="font-bold text-stone-900 dark:text-white">${game.ourScore}</span><span class="opacity-40 px-1">-</span><span class="opacity-70">${game.oppScore}</span> <span class="opacity-50 px-1">${game.isHome ? 'VS' : '@'}</span> ${game.oppAbbrev}`;
          } else if (game.isPre) {
            indicator = `<span class="text-stone-500">NEXT</span>`;
            gameString = `<span class="opacity-50">${game.isHome ? 'VS' : '@'}</span> ${game.oppAbbrev}`;
          } else {
            indicator = `<span class="text-stone-500">LATEST</span>`;
            const isWin = parseInt(game.ourScore) > parseInt(game.oppScore);
            const wL = isWin ? '<span class="text-emerald-500 font-black">W</span>' : '<span class="text-stone-500 font-black">L</span>';
            gameString = `${wL} <span class="font-bold text-stone-900 dark:text-white ml-1">${game.ourScore}</span><span class="opacity-40 px-1">-</span><span class="opacity-70">${game.oppScore}</span> <span class="opacity-50 px-1">${game.isHome ? 'VS' : '@'}</span> ${game.oppAbbrev}`;
          }

          // Universal Standings Injection
          let standingHtml = '';
          let isMlbInjected = false;
          
          if (mlbTeams) {
            const queryTokens = currentFilter.toLowerCase().split(' ').filter(t => t.length > 2 && t !== 'baseball' && t !== 'mlb');
            const matchedTeam = Object.keys(mlbTeams).find(t => queryTokens.every(token => t.includes(token)));
            
            if (matchedTeam) {
              const stats = mlbTeams[matchedTeam];
              const sText = `${stats.rank}${['ST','ND','RD'][stats.rank-1] || 'TH'} IN DIV`;
              const gbText = stats.gb !== '-' ? `(${stats.gb} GB)` : '';
              standingHtml = `
                <div class="h-px w-full bg-stone-100 dark:bg-stone-800 my-3"></div>
                <div class="flex items-center gap-3 overflow-x-auto hide-scrollbar text-[10px] font-mono font-bold tracking-widest uppercase text-stone-500 dark:text-stone-400 whitespace-nowrap">
                  <span>${sText} <span class="opacity-50">${gbText}</span></span>
                  <span class="text-stone-200 dark:text-stone-800">|</span>
                  <span>STREAK: ${stats.streak}</span>
                </div>
              `;
              isMlbInjected = true;
            }
          }
          
          if (!isMlbInjected && game.standing) {
             standingHtml = `
                <div class="h-px w-full bg-stone-100 dark:bg-stone-800 my-3"></div>
                <div class="flex items-center gap-3 overflow-x-auto hide-scrollbar text-[10px] font-mono font-bold tracking-widest uppercase text-stone-500 dark:text-stone-400 whitespace-nowrap">
                  <span>${game.standing}</span>
                </div>
              `;
          }

          const brand = getTopicBrand(currentFilter);

          container.innerHTML = `
            <a href="${vitals.link}" target="_blank" class="block mb-6 bg-white dark:bg-[#161618] rounded-[24px] border border-stone-200 dark:border-stone-800 p-5 shadow-sm active-press transition-transform overflow-hidden relative">
               <div class="absolute -right-10 -top-10 w-48 h-48 rounded-full blur-[60px] opacity-[0.08]" style="background-color: ${brand.accent}"></div>
               
               <div class="flex justify-between items-center mb-4 relative z-10">
                  <div class="flex items-center gap-3.5">
                     ${logoHtml}
                     <div class="flex flex-col">
                        <span class="text-[9px] font-mono text-stone-400 dark:text-stone-500 tracking-widest uppercase mb-0.5">Team Vitals</span>
                        <span class="font-black text-stone-900 dark:text-white uppercase tracking-tight text-[19px] leading-none">${vitals.teamName}</span>
                     </div>
                  </div>
                  <div class="text-right shrink-0 flex flex-col items-end">
                     ${recordHtml}
                     ${rankHtml}
                  </div>
               </div>
               <div class="h-px w-full bg-stone-100 dark:bg-stone-800 mb-3 relative z-10"></div>
               <div class="flex items-center justify-between relative z-10">
                   <div class="flex items-center gap-2.5 text-[12px] font-mono font-bold tracking-widest uppercase text-stone-600 dark:text-stone-300">
                      ${indicator}
                      <span class="text-stone-300 dark:text-stone-700">•</span>
                      <span>${gameString}</span>
                   </div>
                   <span class="text-[10px] px-2 py-1 bg-stone-100 dark:bg-stone-800 text-stone-600 dark:text-stone-400 rounded font-mono shrink-0 leading-none">${game.detail}</span>
               </div>
               ${standingHtml}
            </a>
          `;
        }
      } catch(e) {
        container.innerHTML = '';
      }
    }

    // --- SETTINGS UI & DRAG AND DROP ---
    function renderSettingsList() {
      const list = document.getElementById('topics-list');
      list.innerHTML = userTopics.map(topic => `
        <div data-topic="${topic}" class="topic-item flex justify-between items-center bg-stone-50 dark:bg-[#2C2C2E] p-3 rounded-xl border border-stone-100 dark:border-stone-800">
          <div class="flex items-center gap-3">
            <div class="drag-handle text-stone-300 dark:text-stone-500 cursor-grab active:cursor-grabbing touch-none p-1 -ml-1">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/></svg>
            </div>
            <span class="font-medium text-sm select-none">${topic}</span>
          </div>
          <button onclick="removeTopic('${topic}')" class="text-stone-400 hover:text-red-500 transition-colors p-1"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        </div>
      `).join('');

      if (sortableInstance) sortableInstance.destroy();
      sortableInstance = new Sortable(list, {
        handle: '.drag-handle', animation: 150, ghostClass: 'sortable-ghost',
        onEnd: function () {
          const items = list.querySelectorAll('.topic-item');
          userTopics = Array.from(items).map(item => item.getAttribute('data-topic'));
          localStorage.setItem('signalPassTopics', JSON.stringify(userTopics));
          renderFilters(); 
        }
      });
    }

    function toggleSettings() {
      const modal = document.getElementById('settings-modal');
      const isHidden = modal.classList.contains('modal-hidden');
      if (isHidden) {
        renderSettingsList();
        modal.classList.remove('modal-hidden');
        modal.classList.add('modal-visible');
      } else {
        modal.classList.remove('modal-visible');
        modal.classList.add('modal-hidden');
      }
    }

    document.getElementById('add-topic-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('new-topic-input');
      const val = input.value.trim();
      if (val && !userTopics.includes(val)) {
        userTopics.push(val); localStorage.setItem('signalPassTopics', JSON.stringify(userTopics));
        input.value = ''; toggleSettings(); setFilter(val); fetchSignals(true);
      }
    });

    window.removeTopic = (topic) => {
      userTopics = userTopics.filter(t => t !== topic);
      localStorage.setItem('signalPassTopics', JSON.stringify(userTopics));
      toggleSettings(); if (currentFilter === topic) setFilter('Overview'); renderFilters(); fetchSignals(true);
    };

    window.setFilter = (f) => {
      currentFilter = f; renderFilters(); renderVitals(); window.scrollTo({ top: 0, behavior: 'smooth' }); renderDashboard();
    };

    function renderFilters() {
      const container = document.getElementById('filter-container');
      container.innerHTML = ['Overview', ...userTopics].map(f => {
        const isActive = currentFilter === f;
        const classes = isActive ? 'text-black dark:text-white border-black dark:border-white font-semibold' : 'text-stone-500 dark:text-stone-400 border-transparent hover:text-stone-800 dark:hover:text-stone-200';
        return `<button onclick="setFilter('${f}')" class="active-press text-[15px] px-2 py-2 border-b-[3px] transition-colors whitespace-nowrap no-select ${classes}">${f}</button>`;
      }).join('');
    }

    // --- MAIN RENDERER (The "Data is Hero" Pivot) ---
    function renderDashboard() {
      const container = document.getElementById('dashboard-content');
      const filtered = wireData.filter(e => currentFilter === 'Overview' || e.topic === currentFilter);
      
      if (isSyncing && wireData.length === 0) return;
      if (filtered.length === 0) { 
        container.innerHTML = `<div class="text-center py-12 text-sm text-stone-400 font-mono">No signals detected. Waiting for intelligence...</div>`; 
        return; 
      }

      let html = '';

      if (currentFilter === 'Overview') {
        const heroItem = filtered[0];
        const wireItems = filtered.slice(1);
        
        if (heroItem.image) {
          html += `
          <a href="${heroItem.link}" target="_blank" rel="noopener noreferrer" class="active-press group relative w-full h-48 sm:h-56 rounded-[2rem] overflow-hidden mb-4 block bg-stone-900 shadow-sm border border-stone-200 dark:border-stone-800">
            <div class="absolute inset-0 bg-cover bg-center bg-no-repeat transition-transform duration-700 group-hover:scale-105" style="background-image: url('${heroItem.image}');"></div>
            <div class="absolute inset-0 hero-gradient"></div>
            <div class="absolute inset-x-0 bottom-0 p-5 sm:p-6 flex flex-col justify-end">
              <div class="flex items-center gap-3 mb-2">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider bg-black/60 text-white backdrop-blur-md border border-white/10">${heroItem.topic}</span>
                <span class="text-[10px] font-mono text-stone-300 font-medium flex items-center gap-1"><div class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></div>${getTimeAgo(heroItem.pubDate)}</span>
              </div>
              <h2 class="text-[22px] sm:text-[26px] font-sans font-bold tracking-tight leading-[1.15] text-white mb-1 line-clamp-3" style="text-shadow: 0 2px 10px rgba(0,0,0,0.5);">${heroItem.title}</h2>
            </div>
          </a>`;
        } else {
          const brand = getTopicBrand(heroItem.topic);
          html += `
          <a href="${heroItem.link}" target="_blank" rel="noopener noreferrer" class="active-press group relative w-full h-48 sm:h-56 rounded-[2rem] overflow-hidden mb-4 block shadow-sm border border-stone-200 dark:border-stone-800" style="background: linear-gradient(135deg, ${brand.from} 0%, ${brand.to} 100%);">
            <div class="absolute -top-20 -left-20 w-64 h-64 rounded-full blur-[90px] opacity-30 pointer-events-none" style="background-color: ${brand.accent};"></div>
            <div class="absolute -bottom-20 -right-20 w-48 h-48 rounded-full blur-[70px] opacity-10 pointer-events-none" style="background-color: ${brand.accent};"></div>
            <div class="absolute inset-x-0 bottom-0 p-5 sm:p-6 flex flex-col justify-end z-10">
              <div class="flex items-center gap-3 mb-2">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider bg-white/10 text-white backdrop-blur-md border border-white/10">${heroItem.topic}</span>
                <span class="text-[10px] font-mono text-stone-300 font-medium flex items-center gap-1"><div class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></div>${getTimeAgo(heroItem.pubDate)}</span>
              </div>
              <h2 class="text-[22px] sm:text-[26px] font-sans font-bold tracking-tight leading-[1.15] text-white mb-1 line-clamp-3">${heroItem.title}</h2>
            </div>
          </a>`;
        }
        
        html += `<div class="flex flex-col">`;
        wireItems.forEach(item => { html += buildWireItem(item); });
        html += `</div>`;
        
      } else {
        html += `<div class="flex flex-col">`;
        filtered.forEach(item => { html += buildWireItem(item); });
        html += `</div>`;
      }
      
      container.innerHTML = html;
    }

    function buildWireItem(item) {
      const impact = analyzeImpact(item.title);
      const thumbnailHtml = item.image ? `<div class="shrink-0 ml-4 w-[72px] h-[72px] rounded-xl bg-stone-200 dark:bg-stone-800 bg-cover bg-center border border-stone-100 dark:border-stone-800/50" style="background-image: url('${item.image}')"></div>` : '';
      
      return `
        <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="active-press py-4 border-b border-stone-100 dark:border-stone-900 last:border-0 flex items-center justify-between group">
          <div class="flex-1 pr-2">
            <div class="flex items-center gap-2 mb-1.5">
              <span class="text-[9px] font-black uppercase tracking-widest ${impact.color}">${impact.level}</span>
              <span class="text-stone-300 dark:text-stone-800 mx-1">•</span>
              <span class="text-[10px] font-mono text-stone-500 dark:text-stone-400 uppercase tracking-wide truncate max-w-[120px]">${item.topic}</span>
            </div>
            <h3 class="text-[16px] sm:text-[17px] font-sans font-semibold leading-snug tracking-tight text-stone-900 dark:text-stone-100 group-hover:text-signal-accent transition-colors ${item.image ? 'line-clamp-2' : 'line-clamp-3'}">${item.title}</h3>
            <div class="text-[11px] text-stone-500 dark:text-stone-400 mt-2 flex items-center gap-1.5">
              <span class="font-semibold text-stone-700 dark:text-stone-300 truncate max-w-[140px]">${item.source}</span>
              <span class="opacity-50">•</span>
              <span>${getTimeAgo(item.pubDate)}</span>
            </div>
          </div>
          ${thumbnailHtml}
        </a>
      `;
    }

    // --- CONCURRENT DATA GATHERING ---
    async function fetchSignals(manual = false) {
      if (isSyncing) return;
      isSyncing = true;
      const btn = document.getElementById('sync-btn'); const text = document.getElementById('status-text'); const dot = document.getElementById('pulse-dot');
      btn.classList.add('animate-spin'); dot.classList.replace('bg-emerald-500', 'bg-stone-400'); dot.classList.remove('animate-pulse'); text.innerText = 'GATHERING INTEL...';
      
      renderFilters(); renderVitals(); 
      
      const fetchPromises = userTopics.map(async (topic) => {
        try {
          const query = encodeURIComponent(`${topic} when:2d`);
          const url = `https://news.google.com/rss/search?q=${query}&hl=en-US&gl=US&ceid=US:en`;
          const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`);
          const data = await res.json();
          if (!data || !data.items) return [];

          return data.items.map(item => {
            const titleParts = item.title.split(' - '); const source = titleParts.pop(); const cleanTitle = titleParts.join(' - ').trim();
            let extImg = null;
            if (item.description) {
              const imgMatch = item.description.match(/<img[^>]+src="([^">]+)"/);
              if (imgMatch && imgMatch[1].startsWith('http') && !imgMatch[1].includes('1x1')) extImg = imgMatch[1];
            }
            return { id: item.guid, topic: topic, source: source, title: cleanTitle, pubDate: item.pubDate, image: extImg, link: item.link };
          });
        } catch (err) { return []; }
      });

      const resultsArrays = await Promise.all(fetchPromises);
      let allSignals = resultsArrays.flat();

      const uniqueSignals = []; const titleSignatures = new Set();
      allSignals.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
      allSignals.forEach(signal => {
        const signature = signal.title.toLowerCase().replace(/[^a-z0-9 ]/g, '').substring(0, 35);
        if (!titleSignatures.has(signature)) { titleSignatures.add(signature); uniqueSignals.push(signal); }
      });
      
      wireData = uniqueSignals; localStorage.setItem('signalPassV15', JSON.stringify(wireData));
      
      isSyncing = false; btn.classList.remove('animate-spin'); dot.classList.replace('bg-stone-400', 'bg-emerald-500'); dot.classList.add('animate-pulse'); text.innerText = 'LIVE NETWORK';
      renderDashboard();
    }

    function init() {
      const cached = localStorage.getItem('signalPassV15');
      if (cached) { try { wireData = JSON.parse(cached); renderFilters(); renderVitals(); renderDashboard(); document.getElementById('status-text').innerText = 'PULLING FRESH INTEL...'; } catch(e) {} }
      fetchSignals(); setInterval(fetchSignals, 15 * 60 * 1000);
    }
    init();
  </script>
</body>
</html>
