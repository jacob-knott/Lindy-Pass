<!doctype html>
<html lang="en" class="antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Signal Pass">
  <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/c/ca/1x1.png/120px-1x1.png">
  
  <title>Signal Pass</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'San Francisco', 'Helvetica Neue', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
            serif: ['ui-serif', 'Georgia', 'Cambria', 'Times New Roman', 'Times', 'serif']
          },
          colors: {
            signal: {
              bg: '#F2F2F7', 
              bgDark: '#000000',
              accent: '#0A84FF'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { -webkit-overflow-scrolling: touch; overscroll-behavior-y: none; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .no-select { -webkit-user-select: none; user-select: none; }
    
    .active-press:active { transform: scale(0.98); opacity: 0.8; transition: all 0.1s; }
    
    /* Hero Image Gradient Overlay to ensure text readability */
    .hero-gradient {
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0.1) 100%);
    }
    
    /* Truncate text elegantly */
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>
<body class="bg-[#FFFFFF] dark:bg-[#000000] text-[#111] dark:text-[#F2F2F7] transition-colors duration-200 min-h-screen">

  <div class="h-12 w-full sticky top-0 z-50 bg-[#FFFFFF]/80 dark:bg-[#000000]/80 backdrop-blur-xl md:hidden"></div>

  <div class="max-w-3xl mx-auto px-4 sm:px-6 py-6 md:py-12 pb-24">
    
    <!-- EXECUTIVE HEADER -->
    <header class="mb-6 flex justify-between items-end">
      <div>
        <h1 class="text-3xl md:text-4xl font-bold tracking-tight mb-1">Signal Pass</h1>
        <div class="flex items-center gap-2 mt-1">
          <div id="pulse-dot" class="w-2 h-2 rounded-full bg-stone-400"></div>
          <p id="status-text" class="text-[11px] font-mono text-stone-500 uppercase tracking-widest">Booting engine...</p>
        </div>
      </div>
      
      <button onclick="fetchFeeds(true)" id="sync-btn" class="active-press w-10 h-10 rounded-full bg-stone-100 dark:bg-stone-900 flex items-center justify-center text-stone-600 dark:text-stone-300">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21v-5h5"/></svg>
      </button>
    </header>

    <!-- HORIZONTAL SCROLL CHIPS -->
    <nav class="flex gap-2 mb-8 overflow-x-auto pb-2 -mx-4 px-4 sm:mx-0 sm:px-0 hide-scrollbar border-b border-stone-200 dark:border-stone-800" id="filter-container"></nav>

    <!-- MAIN DASHBOARD -->
    <main id="dashboard-content" class="flex flex-col gap-0">
      <!-- Skeleton Loading State -->
      <div class="animate-pulse h-64 bg-stone-200 dark:bg-stone-900 rounded-3xl w-full mb-4"></div>
      <div class="animate-pulse h-16 bg-stone-100 dark:bg-stone-900/50 rounded-xl w-full mb-2"></div>
      <div class="animate-pulse h-16 bg-stone-100 dark:bg-stone-900/50 rounded-xl w-full mb-2"></div>
    </main>

  </div>

  <script>
    // --- STATE ---
    let currentFilter = 'Overview';
    let wireData = [];
    let isSyncing = false;
    const FILTERS = ['Overview', 'Auburn', 'MLB', 'PGA'];

    // --- UTILITIES ---
    function getTimeAgo(dateString) {
      const now = new Date();
      const past = new Date(dateString.replace(/-/g, '/').replace('T', ' ')); 
      const diffMins = Math.floor((now - past) / 60000);
      const diffHrs = Math.floor(diffMins / 60);

      if (isNaN(diffMins)) return 'RECENTLY';
      if (diffMins < 5) return 'JUST NOW';
      if (diffMins < 60) return `${diffMins}M AGO`;
      if (diffHrs < 24) return `${diffHrs}H AGO`;
      return `${Math.floor(diffHrs/24)}D AGO`;
    }

    function analyzeImpact(title) {
      const lower = title.toLowerCase();
      if (lower.match(/(injury|trade|portal|transfer|commits|fires|hired|championship)/)) {
        return { level: 'CRITICAL', color: 'text-red-500' };
      }
      if (lower.match(/(win|lead|signs|draft|rumor|sweep|series)/)) {
        return { level: 'HIGH', color: 'text-orange-500' };
      }
      return { level: 'UPDATE', color: 'text-stone-400' };
    }

    // --- RENDER PIPELINE ---
    function renderFilters() {
      const container = document.getElementById('filter-container');
      container.innerHTML = FILTERS.map(f => {
        const isActive = currentFilter === f;
        const classes = isActive 
          ? 'text-black dark:text-white border-black dark:border-white font-semibold' 
          : 'text-stone-500 dark:text-stone-500 border-transparent hover:text-stone-800 dark:hover:text-stone-300';
        return `<button onclick="setFilter('${f}')" class="active-press text-sm px-3 py-2 border-b-2 transition-colors whitespace-nowrap no-select ${classes}">${f}</button>`;
      }).join('');
    }

    function renderDashboard() {
      const container = document.getElementById('dashboard-content');
      const filtered = wireData.filter(e => currentFilter === 'Overview' || e.category === currentFilter);
      
      if (isSyncing && wireData.length === 0) return;

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-sm text-stone-400 font-mono">Wire is silent. No signals detected.</div>`;
        return;
      }

      // The Bento Logic: First item is HERO, rest are DENSE WIRE
      const heroItem = filtered[0];
      const wireItems = filtered.slice(1);

      let html = '';

      // --- 1. THE HERO CARD ---
      const heroImpact = analyzeImpact(heroItem.title);
      // Fallback subtle background if RSS feed failed to provide an image
      const heroBg = heroItem.image ? `url('${heroItem.image}')` : `linear-gradient(135deg, #1f2937 0%, #111827 100%)`;
      
      html += `
        <a href="https://www.google.com/search?q=${encodeURIComponent(heroItem.searchQuery)}" target="_blank" rel="noopener noreferrer" 
           class="active-press group relative w-full h-72 sm:h-80 rounded-[2rem] overflow-hidden mb-6 block bg-stone-900 shadow-lg">
          
          <!-- Background Image -->
          <div class="absolute inset-0 bg-cover bg-center bg-no-repeat transition-transform duration-700 group-hover:scale-105" 
               style="background-image: ${heroBg};"></div>
          
          <!-- Dark Gradient Overlay for text readability -->
          <div class="absolute inset-0 hero-gradient"></div>
          
          <!-- Content locked to the bottom -->
          <div class="absolute inset-x-0 bottom-0 p-6 sm:p-8 flex flex-col justify-end">
            <div class="flex items-center gap-3 mb-3">
              <span class="text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider bg-black/50 text-white backdrop-blur-md border border-white/10">
                ${heroItem.sport}
              </span>
              <span class="text-[10px] font-mono text-stone-300 font-medium flex items-center gap-1">
                <div class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></div>
                ${getTimeAgo(heroItem.pubDate)}
              </span>
            </div>
            <h2 class="text-2xl sm:text-3xl font-serif font-medium leading-tight text-white mb-2 text-shadow-sm">
              ${heroItem.title}
            </h2>
          </div>
        </a>
      `;

      // --- 2. THE DENSE WIRE ---
      html += `<div class="flex flex-col">`;
      
      wireItems.forEach(item => {
        const impact = analyzeImpact(item.title);
        
        // If the item has a thumbnail, show a tiny square image on the right. If not, just text.
        const thumbnailHtml = item.image 
          ? `<div class="shrink-0 ml-4 w-16 h-16 rounded-xl bg-stone-200 dark:bg-stone-800 bg-cover bg-center" style="background-image: url('${item.image}')"></div>`
          : '';

        html += `
          <a href="https://www.google.com/search?q=${encodeURIComponent(item.searchQuery)}" target="_blank" rel="noopener noreferrer" 
             class="active-press py-4 border-b border-stone-100 dark:border-stone-900 last:border-0 flex items-center justify-between group">
            
            <div class="flex-1 pr-4">
              <div class="flex items-center gap-2 mb-1">
                <span class="text-[9px] font-black uppercase tracking-widest ${impact.color}">${impact.level}</span>
                <span class="text-stone-300 dark:text-stone-700 mx-1">•</span>
                <span class="text-[10px] font-mono text-stone-500 uppercase tracking-wide">${item.sport}</span>
              </div>
              
              <h3 class="text-[15px] sm:text-base font-medium leading-snug text-stone-900 dark:text-stone-100 group-hover:text-signal-accent transition-colors line-clamp-2">
                ${item.title}
              </h3>
              
              <div class="text-[10px] font-mono text-stone-400 mt-1.5">
                ${getTimeAgo(item.pubDate)}
              </div>
            </div>
            
            ${thumbnailHtml}
          </a>
        `;
      });
      
      html += `</div>`;
      container.innerHTML = html;
    }

    window.setFilter = (f) => {
      currentFilter = f;
      renderFilters();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderDashboard();
    };

    // --- DATA ENGINE (WITH IMAGE EXTRACTION) ---
    async function fetchFeeds(manual = false) {
      if (isSyncing) return;
      isSyncing = true;
      
      const btn = document.getElementById('sync-btn');
      const text = document.getElementById('status-text');
      const dot = document.getElementById('pulse-dot');
      
      btn.classList.add('animate-spin');
      dot.classList.replace('bg-emerald-500', 'bg-stone-400');
      dot.classList.remove('animate-pulse');
      text.innerText = 'SYNCING WIRE...';
      
      const feeds = [
        { sport: 'MLB', category: 'MLB', url: 'https://www.espn.com/espn/rss/mlb/news' },
        { sport: 'MLB', category: 'MLB', url: 'https://www.reddit.com/r/baseball/new/.rss' },
        { sport: 'PGA Tour', category: 'PGA', url: 'https://www.espn.com/espn/rss/golf/news' },
        { sport: 'Auburn', category: 'Auburn', url: 'https://www.espn.com/espn/rss/ncf/news' },
        { sport: 'Auburn', category: 'Auburn', url: 'https://www.espn.com/espn/rss/ncb/news' },
        { sport: 'Auburn', category: 'Auburn', url: 'https://www.reddit.com/r/wde/new/.rss' }
      ];

      let liveNews = [];

      for (let feed of feeds) {
        try {
          const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`);
          const data = await res.json();
          
          if (data && data.items) {
            let items = data.items;
            
            if (feed.category === 'Auburn' && !feed.url.includes('reddit')) {
              items = items.filter(item => {
                const searchTxt = (item.title + ' ' + item.description).toLowerCase();
                return searchTxt.includes('auburn') || searchTxt.includes('tigers') || searchTxt.includes('sec');
              });
            }

            if (feed.url.includes('reddit')) {
              items = items.filter(item => !item.title.toLowerCase().includes('game thread') && !item.title.toLowerCase().includes('weekly'));
            }

            const parsed = items.slice(0, 8).map(item => {
              const cleanTitle = item.title.replace(/\[.*?\]/g, '').trim();
              
              // IMAGE EXTRACTION LOGIC
              let imageUrl = null;
              // Check standard rss2json thumbnail
              if (item.thumbnail && item.thumbnail.startsWith('http')) {
                imageUrl = item.thumbnail;
              } 
              // Check enclosure
              else if (item.enclosure && item.enclosure.link && item.enclosure.link.startsWith('http')) {
                imageUrl = item.enclosure.link;
              } 
              // Fallback: Check if there's an img tag hiding in the description
              else if (item.description) {
                const imgMatch = item.description.match(/<img[^>]+src="([^">]+)"/);
                if (imgMatch && imgMatch[1].startsWith('http')) {
                   // Ignore tiny tracking pixels
                   if (!imgMatch[1].includes('1x1')) {
                     imageUrl = imgMatch[1];
                   }
                }
              }

              return {
                id: item.guid || item.link,
                sport: feed.sport,
                category: feed.category,
                title: cleanTitle,
                pubDate: item.pubDate, 
                image: imageUrl, // Storing extracted image
                searchQuery: `${cleanTitle} ${feed.category} latest news`
              };
            });
            liveNews = [...liveNews, ...parsed];
          }
        } catch (err) {
          console.warn(`Feed error: ${feed.sport}`);
        }
      }

      const uniqueMap = new Map();
      liveNews.forEach(item => uniqueMap.set(item.title, item));
      wireData = Array.from(uniqueMap.values()).sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
      
      localStorage.setItem('signalPassCacheV4', JSON.stringify(wireData));
      
      isSyncing = false;
      btn.classList.remove('animate-spin');
      dot.classList.replace('bg-stone-400', 'bg-emerald-500');
      dot.classList.add('animate-pulse');
      text.innerText = 'LIVE NETWORK';
      
      renderDashboard();
    }

    // --- INITIALIZATION ---
    function init() {
      renderFilters();

      const cached = localStorage.getItem('signalPassCacheV4');
      if (cached) {
        try {
          wireData = JSON.parse(cached);
          renderDashboard();
          document.getElementById('status-text').innerText = 'PULLING FRESH DATA...';
        } catch(e) {}
      }

      fetchFeeds();
      setInterval(fetchFeeds, 10 * 60 * 1000); // 10 min auto-refresh
    }

    init();
  </script>
</body>
</html>
